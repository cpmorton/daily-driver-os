---
name: Build and Push Image

# Trunk-based releases (decision 0025): every build here is a candidate from
# main and publishes :stable-testing. release.yml promotes the exact signed
# digest to :stable when a maintainer dispatches it; :stable is never rebuilt.
#
# Builds publish on push to main and once daily. A pull request gets the same
# build without publishing (the `image-build` job), so a change that breaks the
# image — a Renovate digest bump included — is caught before it reaches main.
# A change to a workflow the build depends on — build-image, release, unit
# tests — still builds. pr-validation.yml is PR linting only.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  # Daily rebuild. Chrome, VS Code and claude-code are baked-in RPMs: without a
  # rebuild they only update when a commit lands. 14:00 UTC is ~10:00 America/
  # New_York in summer (EDT) and ~09:00 in winter (EST) — cron is UTC, so the
  # wall-clock time shifts an hour across US DST.
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

# Each job declares what it needs. The pull-request job gets read-only access,
# so code under review never holds packages: write or a signing identity.
permissions:
  contents: read

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  # Image description, keywords and logo are the Containerfile's ARGs, so CI and
  # local builds agree. Set IMAGE_DESC, IMAGE_KEYWORDS, IMAGE_LOGO_URL or
  # IMAGE_REF here only to override the Containerfile deliberately.
  DEFAULT_TAG: "stable"
  # No branch publishes :stable since decision 0025, so every build is a
  # :stable-testing candidate; release.yml is the only path to :stable.
  PRODUCTION_BRANCH: "stable"
  REGISTRY_CACHE_WRITE: "1" # main builds write the layer cache; PR and local builds stay read-only
  ENABLE_RECHUNKING: "false"
  RECHUNK_MAX_LAYERS: "128"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    # A manual dispatch may select any ref. Limit it to the repository's default
    # branch so it cannot bypass the candidate-digest release path by rebuilding
    # and publishing from stable.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    # 26.04 ships Podman 5.x, so setup-runner skips the resolute apt install
    # and its apt cache, which on 24.04 never saves: tar runs as the runner
    # user and cannot read apt's root-only lock and partial/. [VERIFY]
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      # Anything not on the production branch is a testing build. TAG_STREAM
      # keeps generate-tags on the "testing" stream so it never emits
      # stable-daily* aliases that would collide with production; the
      # Finalize branch tags step renames them to stable-testing-*.
      - name: Determine image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "DEFAULT_TAG=${DEFAULT_TAG}-testing" >> "${GITHUB_ENV}"
            echo "TAG_STREAM=testing" >> "${GITHUB_ENV}"
            echo "Building testing image: ${DEFAULT_TAG}-testing"
          else
            echo "TAG_STREAM=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
            echo "Building production image: ${DEFAULT_TAG}"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Renovate cannot age GHCR or Quay digests (they publish no release
      # timestamps), so a bumped digest is checked here instead: each signed
      # upstream image must carry its publisher's signature before anything is
      # built on it. common signs keyless from its own repository's workflows;
      # brew signs with ublue-os's key, copied from ublue-os/brew. The Fedora
      # base is not checked: it is pinned by digest only. [VERIFY]
      - name: Verify upstream image signatures
        shell: bash
        run: |
          set -euo pipefail
          pinned() {
            sed -nE "s|^FROM (${1//./\\.}):[^@ ]+@(sha256:[0-9a-f]{64}).*|\\1@\\2|p" Containerfile
          }
          common=$(pinned ghcr.io/projectbluefin/common)
          brew=$(pinned ghcr.io/ublue-os/brew)
          [[ -n "${common}" && -n "${brew}" ]] || { echo "::error::Containerfile no longer pins common and brew by digest"; exit 1; }

          cosign verify \
            --certificate-identity-regexp '^https://github\.com/projectbluefin/common/\.github/workflows/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${common}" >/dev/null
          cosign verify --key .github/cosign/ublue-os.pub "${brew}" >/dev/null
          echo "Signatures verified: ${common} ${brew}"

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        id: dnf-cache-restore
        uses: projectbluefin/actions/bootc-build/dnf-cache@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      - name: Build image
        id: build-image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VENDOR: ${{ env.IMAGE_VENDOR }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 300
          command: |
            sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Get version label
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      - name: Generate tags
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ env.TAG_STREAM }}
          version-label: ${{ steps.version.outputs.version }}
          event-name: ${{ github.event_name }}

      # generate-tags emits stream-native tags (testing* or stable-daily* plus
      # version aliases). For testing builds this renames testing* tags to
      # stable-testing-* and guarantees the mutable consumer tag
      # (:stable-testing) is always published.
      - name: Finalize branch tags
        id: branch-tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.generate-tags.outputs.tags }}
        run: |
          read -r -a generated_tags <<< "${GENERATED_TAGS}"
          branch_tags=()

          add_tag() {
            local candidate="$1"
            local existing
            for existing in "${branch_tags[@]}"; do
              [[ "${existing}" == "${candidate}" ]] && return
            done
            branch_tags+=("${candidate}")
          }

          for tag in "${generated_tags[@]}"; do
            if [[ "${TAG_STREAM}" == "testing" ]]; then
              add_tag "${tag/testing/stable-testing}"
            else
              add_tag "${tag}"
            fi
          done
          add_tag "${DEFAULT_TAG}"

          echo "tags=${branch_tags[*]}" >> "${GITHUB_OUTPUT}"
          echo "default-tag=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Save DNF cache
        if: always() && !cancelled()
        uses: projectbluefin/actions/bootc-build/dnf-cache@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          action: save
          cache-name: ${{ env.IMAGE_NAME }}
          allow-write: "true"
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      # OPTIONAL: Set ENABLE_RECHUNKING to "true" above to optimize OTA deltas.
      # This uses OCI-native chunkah and does not require bootc-base-imagectl.
      - name: Rechunk image
        if: env.ENABLE_RECHUNKING == 'true'
        id: rechunk-image
        uses: projectbluefin/actions/bootc-build/chunka@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          source-image: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          max-layers: ${{ env.RECHUNK_MAX_LAYERS }}

      - name: Tag images
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.branch-tags.outputs.tags }}
        run: |
          sudo -E "$(command -v just)" tag-images "${IMAGE_NAME}" \
                          "${DEFAULT_TAG}" \
                          "${ALIAS_TAGS}"

      # Every build here is a candidate build from main and publishes tags.
      # release.yml promotes the signed candidate digest to :stable without a
      # rebuild, so the upstream push-image action owns all registry
      # authentication and pushing.

      - name: Push to GHCR
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.branch-tags.outputs.tags }}
          default-tag: ${{ steps.branch-tags.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Sign and attest (SLSA Build L2 provenance)
      # Bluefin pattern: keyless OIDC signing via Fulcio.
      # Requires 'id-token: write' permission (granted above).
      # Signing failures do not block candidate publication, but release.yml
      # refuses an unsigned candidate and leaves the prior :stable in place.

      - name: Sign and publish
        continue-on-error: true
        uses: projectbluefin/actions/bootc-build/sign-and-publish@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: false
          push-attestation: true
          certificate-identity-regexp: https://github.com/${{ github.repository }}/.github/workflows/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build telemetry summary
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(sudo podman image inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${IMAGE_NAME}"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"

  # The pull-request check: does this change still build? It never publishes,
  # signs or writes a cache. A squash merge makes a new commit, so a PR image
  # could never be the one main ships anyway; main rebuilds and publishes.
  # It builds only when the PR touches an image input, so CI- and docs-only PRs
  # don't each cost a full build, and it always reports, so it can be a
  # required check without leaving those PRs waiting forever.
  image-build:
    name: image-build
    if: github.event_name == 'pull_request'
    # Keep in step with the build job's runner and setup;
    # tests/template/build-image-pr_test.bats checks they match.
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}-testing" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Decide whether the image can change
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The image's inputs: what the Containerfile copies or binds (build/,
          # custom/), the Containerfile and Justfile themselves, and this
          # workflow. Collected first: `git diff | grep -q` can SIGPIPE git,
          # and pipefail would then read a real change as no change.
          changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")
          inputs=$(grep -E '^(Containerfile|Justfile|build/|custom/|\.github/workflows/build-image\.yml$)' <<<"${changed}" || true)
          if [[ -n "${inputs}" ]]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::No image input changed, so the image cannot differ; nothing to build."
            echo "build=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup runner
        if: steps.scope.outputs.build == 'true'
        uses: projectbluefin/actions/bootc-build/setup-runner@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        if: steps.scope.outputs.build == 'true'
        uses: projectbluefin/actions/bootc-build/dnf-cache@59f783ed76fd9d449ef6887a6649446801bd5434 # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      # REGISTRY_CACHE_WRITE=0: read the published layer cache, never write it,
      # so an unmerged change cannot seed layers main later reuses.
      - name: Build image
        if: steps.scope.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_CACHE_WRITE: "0"
        run: sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"
