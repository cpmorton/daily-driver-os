name: Renovate

on:
  schedule:
    # Weekly (Mon 14:00 UTC). Throttled from every-6h to cut PR churn while
    # keeping supply-chain/dependency updates flowing; dispatch for an ad-hoc run.
    - cron: "0 14 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-renovate.yml@d1f65645c53d413462117fe1f05d00b9d9382f89 # v1
    secrets:
      renovate_token: ${{ secrets.RENOVATE_TOKEN }}
