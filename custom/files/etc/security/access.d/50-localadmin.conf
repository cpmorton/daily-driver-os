# localadmin may log in only where PAM_RHOST is unset: the console, GDM, su,
# sudo and polkit prompts. sshd (and anything else remote) sets PAM_RHOST, so
# LOCAL does not match and the login is refused. Everyone else: no rule here,
# so no change. Wired by authselect's with-pamaccess feature.
-:localadmin:ALL EXCEPT LOCAL
