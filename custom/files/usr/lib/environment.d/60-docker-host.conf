# Docker-API clients (Testcontainers, docker SDKs, VS Code Dev Containers)
# talk to each user's rootless podman socket. podman-docker sets the same
# value from /etc/profile.d, but only login shells read that; environment.d
# reaches every app the user's systemd instance starts, GUI included.
DOCKER_HOST=unix://${XDG_RUNTIME_DIR}/podman/podman.sock
