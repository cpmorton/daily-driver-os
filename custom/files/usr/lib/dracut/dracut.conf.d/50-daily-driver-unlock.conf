# Unlock the encrypted root with a TPM2 chip or a FIDO2 security key
# (YubiKey), not only a passphrase. Both modules are opt-in: dracut adds them
# only when asked (tpm2-tss also needs tpm2-tools installed). The image rebuilds
# its initramfs with this file in place (build/70-daily-driver.sh).
# See docs/decisions/0021-encrypted-root.md.
add_dracutmodules+=" tpm2-tss fido2 "
