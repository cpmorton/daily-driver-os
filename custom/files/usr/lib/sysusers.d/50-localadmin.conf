# Local administrator: wheel member, console and GDM only.
#   - identity: this file, image-managed (created locked at boot)
#   - password: from the seed stick, or typed on tty1 at first boot
#     (localadmin-firstboot.service); held by whoever administers the machine
#   - remote login: denied by /etc/security/access.d/50-localadmin.conf and sshd
# UID 1000: the first regular UID, so upstream pieces that assume "the first
# user" (ublue-os/brew's prefix and update timers) belong to localadmin.
# Daily users are systemd-homed users in 60001-60513. Create no user in the
# installer: it would take UID 1000 first.
#Type Name       ID    GECOS                  Home                  Shell
u     localadmin 1000  "Local Administrator"  /var/home/localadmin  /bin/bash
m     localadmin wheel
