# Break-glass administrator: wheel member, console and GDM only.
#   - identity: this file, image-managed (created locked at boot)
#   - password: machine-local, set on tty1 by localadmin-firstboot.service
#   - remote login: denied by /etc/security/access.d/50-localadmin.conf and sshd
# UID 1999 stays clear of the installer's first user (1000) and of
# systemd-homed's range (60001-60513).
#Type Name       ID    GECOS                  Home                  Shell
u     localadmin 1999  "Local Administrator"  /var/home/localadmin  /bin/bash
m     localadmin wheel
